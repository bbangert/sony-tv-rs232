[project]
name = "sony-tv-rs232"
version = "0.0.0"
description = "Async library to control Sony Bravia TVs over RS232, built on serialkit"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ben Bangert", email = "ben.bangert@nabucasa.com" }
]
requires-python = ">=3.14"
dependencies = [
    "serialx>=1.8.2",
    # The distribution is "serial-toolkit"; the import package is `serialkit`
    # (PyPI blocks the name "serialkit").
    "serial-toolkit>=0.2.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[project.optional-dependencies]
esphome = ["serialx[esphome]>=1.8.2"]

[project.scripts]
sony-tv-rs232 = "sony_tv_rs232.__main__:main"

[project.urls]
Repository = "https://github.com/home-assistant-libs/sony-tv-rs232"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 5
filterwarnings = [
    "error::RuntimeWarning",
]
