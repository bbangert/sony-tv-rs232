[project]
name = "sony-tv-rs232"
version = "0.0.0"
description = "Async library to control Sony Bravia TVs over RS232, built on serialkit"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ben Bangert", email = "ben.bangert@nabucasa.com" }
]
requires-python = ">=3.14"
dependencies = [
    "serialx>=1.8.2",
    # The distribution is "serial-toolkit"; the import package is `serialkit`
    # (PyPI blocks the name "serialkit").
    "serial-toolkit>=0.3.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: System :: Hardware",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[project.optional-dependencies]
esphome = ["serialx[esphome]>=1.8.2"]

[project.scripts]
sony-tv-rs232 = "sony_tv_rs232.__main__:main"

[project.urls]
Repository = "https://github.com/bbangert/sony-tv-rs232"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "pytest-timeout>=2.4.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Pinned explicitly: bare `ruff check` follows whatever the latest release
# enables by default, so the lint contract would otherwise drift with every
# ruff upgrade.
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "ASYNC",
    "SIM",
    "RUF",
    # A broad catch has to justify itself in writing rather than accumulate
    # by habit.
    "BLE",
    "S110",
    "S112",
    "FBT",
    "ARG",
]
ignore = [
    # The command surface takes its on/off value positionally --
    # `set_mute(True)` is the public API.
    "FBT001",
    "FBT003",
]

[tool.ruff.lint.per-file-ignores]
# Predicates, callbacks and fixtures in tests take arguments they deliberately
# ignore, and @parametrize drives boolean positional parameters.
"tests/*" = ["ARG", "FBT"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 5
filterwarnings = [
    "error::RuntimeWarning",
]
